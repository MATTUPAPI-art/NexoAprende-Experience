<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>NexoAprende Experience</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Un universo para descubrir, jugar y aprender a tu ritmo. Experiencias educativas de atención, memoria y lectura de 5 a 18 años."
    />
    <meta name="theme-color" content="#7860b5" />
    <link rel="icon" type="image/webp" href="images/optimized/favicon-nexoaprende.webp" />
    <script>
      try {
        const theme = JSON.parse(localStorage.getItem('nexo.theme'));
        if (theme === 'night') {
          document.documentElement.dataset.theme = 'night';
          document.documentElement.style.colorScheme = 'dark';
          document.documentElement.style.backgroundColor = '#10172b';
        }
      } catch {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
